spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paylab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paylab}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:paylab}

paylab.webhook.signing-secret=${PAYLAB_WEBHOOK_SIGNING_SECRET:local-dev-only-secret}
paylab.webhook.connect-timeout=2s
paylab.webhook.request-timeout=5s
paylab.webhook.worker-delay=1s
paylab.webhook.claim-seconds=30
paylab.webhook.allowed-hosts=localhost,127.0.0.1,::1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/docs/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.paths-to-match=/payments/**,/test-runs/**

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr=%X{correlationId:-none} run=%X{runId:-none}] - %msg%n
